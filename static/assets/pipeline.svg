<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-label="Diagram of the rustfolio build pipeline: Markdown content, the Rust generator, and static output">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8276"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f2ede4; stroke: #cfc5b4; stroke-width: 1.5; rx: 8; }
    .box-label { font: 600 16px system-ui, sans-serif; fill: #26211c; }
    .sub { font: 400 13px system-ui, sans-serif; fill: #5c554c; }
    .flow { stroke: #8a8276; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <rect class="box" x="20" y="40" width="180" height="120" rx="8"/>
  <text class="box-label" x="40" y="80">content/</text>
  <text class="sub" x="40" y="104">Markdown +</text>
  <text class="sub" x="40" y="124">YAML frontmatter</text>

  <rect class="box" x="290" y="40" width="220" height="120" rx="8"/>
  <text class="box-label" x="310" y="80">Rust generator</text>
  <text class="sub" x="310" y="104">pulldown-cmark · grass</text>
  <text class="sub" x="310" y="124">syntect · validation</text>

  <rect class="box" x="600" y="40" width="140" height="120" rx="8"/>
  <text class="box-label" x="620" y="80">dist/</text>
  <text class="sub" x="620" y="104">static HTML,</text>
  <text class="sub" x="620" y="124">CSS, JSON, XML</text>

  <path class="flow" d="M200 100 H 288" stroke-width="1.5"/>
  <path class="flow" d="M510 100 H 598" stroke-width="1.5"/>

  <rect x="290" y="190" width="220" height="34" rx="8" fill="#e56a35" opacity="0.12"/>
  <text class="sub" x="310" y="212">deterministic · atomic swap</text>
  <path class="flow" d="M400 160 V 188"/>
</svg>
